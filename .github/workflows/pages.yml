name: GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build docs site
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v4

      - name: Verify GitHub Pages is enabled
        run: |
          if [ -z "${{ steps.pages.outputs.base_url }}" ]; then
            echo "::error::GitHub Pages is not enabled for this repository."
            echo "Open Settings → Pages → Build and deployment → Source: GitHub Actions, then re-run this workflow."
            exit 1
          fi
          echo "Pages base URL: ${{ steps.pages.outputs.base_url }}"
          echo "Pages host: ${{ steps.pages.outputs.host }}"
          echo "Pages base path: ${{ steps.pages.outputs.base_path }}"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve site URL and base path
        id: site
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          SITE_DOMAIN: ${{ vars.SITE_DOMAIN }}
          BASE_PATH: ${{ vars.BASE_PATH }}
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          PAGES_HOST: ${{ steps.pages.outputs.host }}
        run: node scripts/resolve-site-deploy.mjs

      - name: Build docs site
        env:
          VITE_SITE_URL: ${{ steps.site.outputs.site_url }}
          VITE_BASE_PATH: ${{ steps.site.outputs.base_path }}
          SITE_URL: ${{ steps.site.outputs.site_url }}
          SITE_DOMAIN: ${{ steps.site.outputs.site_domain }}
          PAGES_HOST: ${{ steps.pages.outputs.host }}
        run: pnpm build:pages

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site-dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
