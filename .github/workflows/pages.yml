name: GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build docs site
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v4
        continue-on-error: true

      - name: Log Pages metadata
        run: |
          if [ -n "${{ steps.pages.outputs.base_url }}" ]; then
            echo "Pages base URL: ${{ steps.pages.outputs.base_url }}"
            echo "Pages host: ${{ steps.pages.outputs.host }}"
            echo "Pages base path: ${{ steps.pages.outputs.base_path }}"
          else
            echo "::warning::GitHub Pages metadata unavailable. Using repository defaults (asriui.dev)."
            echo "Enable Pages: Settings → Pages → Deploy from branch gh-pages (root folder)"
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve site URL and base path
        id: site
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          SITE_DOMAIN: ${{ vars.SITE_DOMAIN }}
          BASE_PATH: ${{ vars.BASE_PATH }}
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          PAGES_HOST: ${{ steps.pages.outputs.host }}
        run: node scripts/resolve-site-deploy.mjs

      - name: Build docs site
        env:
          VITE_SITE_URL: ${{ steps.site.outputs.site_url }}
          VITE_BASE_PATH: ${{ steps.site.outputs.base_path }}
          SITE_URL: ${{ steps.site.outputs.site_url }}
          SITE_DOMAIN: ${{ steps.site.outputs.site_domain }}
          PAGES_HOST: ${{ steps.pages.outputs.host }}
        run: pnpm build:pages

      - name: Upload site artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: site-dist
          retention-days: 1

  deploy:
    name: Deploy to gh-pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download site artifact
        uses: actions/download-artifact@v4
        with:
          name: site-dist
          path: site-dist

      - name: Publish gh-pages branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: site-dist
          branch: gh-pages
          single-commit: true
